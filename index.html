<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Rubik's Cube KPI Extension</title>
    <!-- Include Tableau Extensions API Library -->
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api@main/lib/tableau.extensions.1.latest.js"></script>
    <style>
        :root {
            --cube-size: 320px;
            --grid-gap: 5px;
            --rag-red: #ff4d4d;
            --rag-amber: #ffb31a;
            --rag-green: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .container {
            position: relative;
            width: 460px;
            height: 460px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 3D Scene Viewport */
        .scene {
            width: var(--cube-size);
            height: var(--cube-size);
            perspective: 1000px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* 3D Structural Face Positioning */
        .face {
            position: absolute;
            width: var(--cube-size);
            height: var(--cube-size);
            background: #15151a;
            border: 4px solid #0a0a0d;
            border-radius: 8px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: var(--grid-gap);
            padding: var(--grid-gap);
            backface-visibility: hidden;
        }
        /* Rotations mapping the 6 distinct faces around the center axis */
        .face[data-side="1"] { transform: rotateY(  0deg) translateZ(160px); }
        .face[data-side="2"] { transform: rotateY( 90deg) translateZ(160px); }
        .face[data-side="3"] { transform: rotateY(180deg) translateZ(160px); }
        .face[data-side="4"] { transform: rotateY(-90deg) translateZ(160px); }
        .face[data-side="5"] { transform: rotateX( 90deg) translateZ(160px); }
        .face[data-side="6"] { transform: rotateX(-90deg) translateZ(160px); }

        /* Individual KPI Block Modules (9 per Face) */
        .kpi-card {
            background-color: #24242e;
            border-radius: 5px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            border-left: 4px solid #555;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .kpi-card.RED { border-left-color: var(--rag-red); }
        .kpi-card.AMBER { border-left-color: var(--rag-amber); }
        .kpi-card.GREEN { border-left-color: var(--rag-green); }

        .kpi-title { 
            font-weight: bold; 
            font-size: 10px; 
            color: #b3b3cc; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
        }
        .kpi-main { 
            font-size: 13px; 
            font-weight: 800; 
            margin: 2px 0;
            white-space: nowrap;
        }
        .kpi-achieve {
            font-size: 9px;
            font-weight: normal;
            color: #a0a0a0;
        }
        .kpi-sub-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 2px; 
            color: #8e8e93; 
            font-size: 8px;
        }

        /* Directional Control Arrows */
        .arrow {
            position: absolute;
            background: rgba(36, 36, 46, 0.9);
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 10;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .arrow:hover { 
            background: #323242; 
            transform: scale(1.1); 
            border-color: #777;
        }
        .arrow:active {
            transform: scale(0.95);
        }
        .arrow-up    { top: 5px; left: calc(50% - 19px); }
        .arrow-down  { bottom: 5px; left: calc(50% - 19px); }
        .arrow-left  { left: 5px; top: calc(50% - 19px); }
        .arrow-right { right: 5px; top: calc(50% - 19px); }
    </style>
</head>
<body>

<div class="container">
    <!-- Directional Navigation System -->
    <button class="arrow arrow-up" onclick="rotateCube('up')">▲</button>
    <button class="arrow arrow-down" onclick="rotateCube('down')">▼</button>
    <button class="arrow arrow-left" onclick="rotateCube('left')">◀</button>
    <button class="arrow arrow-right" onclick="rotateCube('right')">▶</button>

    <!-- 3D Environment Wrapper -->
    <div class="scene">
        <div class="cube" id="cube">
            <!-- Six Faces Grid Systems -->
            <div class="face" data-side="1" id="face-1"></div>
            <div class="face" data-side="2" id="face-2"></div>
            <div class="face" data-side="3" id="face-3"></div>
            <div class="face" data-side="4" id="face-4"></div>
            <div class="face" data-side="5" id="face-5"></div>
            <div class="face" data-side="6" id="face-6"></div>
        </div>
    </div>
</div>

<script>
    let currentSide = 1; 
    const parameterName = "sidevalue";

    // Adjacency Matrix: Decides which side shifts into target view based on user navigation direction
    const navigationMap = {
        1: { left: 4, right: 2, up: 5, down: 6 },
        2: { left: 1, right: 3, up: 5, down: 6 },
        3: { left: 2, right: 4, up: 5, down: 6 },
        4: { left: 3, right: 1, up: 5, down: 6 },
        5: { left: 4, right: 2, up: 3, down: 1 },
        6: { left: 4, right: 2, up: 1, down: 3 }
    };

    // Vector Transforms mapping explicit target face alignment
    const faceRotations = {
        1: "rotateX(0deg) rotateY(0deg)",
        2: "rotateX(0deg) rotateY(-90deg)",
        3: "rotateX(0deg) rotateY(-180deg)",
        4: "rotateX(0deg) rotateY(90deg)",
        5: "rotateX(-90deg) rotateY(0deg)",
        6: "rotateX(90deg) rotateY(0deg)"
    };

    document.addEventListener("DOMContentLoaded", () => {
        // Core Extension Initialization
        tableau.extensions.initializeAsync().then(() => {
            fetchTableauData();
            setupParameterListener();
        }).catch(err => console.error("Error initializing Tableau Extension:", err));
    });

    // Extract Summary Data rows from target worksheet data table
    function fetchTableauData() {
        const worksheet = tableau.extensions.dashboardContent.dashboard.worksheets[0];
        
        worksheet.getSummaryDataAsync().then((dataTable) => {
            const fieldIdx = {};
            dataTable.columns.forEach(col => {
                fieldIdx[col.fieldName.toLowerCase().trim()] = col.index;
            });

            // Initialize object structural maps for the 6 cube dimensions
            const cubeData = { 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };

            dataTable.data.forEach(row => {
                const sideVal = parseInt(row[fieldIdx['side']].value);
                if (sideVal >= 1 && sideVal <= 6) {
                    cubeData[sideVal].push({
                        kpiName: row[fieldIdx['kpi name']] ? row[fieldIdx['kpi name']].formattedValue : 'KPI',
                        actual: row[fieldIdx['actual']] ? row[fieldIdx['actual']].formattedValue : '0',
                        achievement: row[fieldIdx['budget achievement']] ? row[fieldIdx['budget achievement']].formattedValue : '0%',
                        rag: row[fieldIdx['rag status']] ? row[fieldIdx['rag status']].value.toString().toUpperCase().trim() : 'AMBER',
                        varianceLM: row[fieldIdx['variance last month']] ? row[fieldIdx['variance last month']].formattedValue : '0',
                        varianceYE: row[fieldIdx['variance year end']] ? row[fieldIdx['variance year end']].formattedValue : '0'
                    });
                }
            });

            renderCubeFaces(cubeData);
        }).catch(err => console.error("Error parsing Summary Data:", err));
    }

    // Dynamic generation of DOM components inside grid objects
    function renderCubeFaces(cubeData) {
        for (let s = 1; s <= 6; s++) {
            const faceEl = document.getElementById(`face-${s}`);
            faceEl.innerHTML = ""; 
            
            const kpis = cubeData[s] || [];
            
            // Build the standard 3x3 Rubik structure (9 spaces per side)
            for (let i = 0; i < 9; i++) {
                if (kpis[i]) {
                    const kpi = kpis[i];
                    faceEl.innerHTML += `
                        <div class="kpi-card ${kpi.rag}">
                            <div class="kpi-title" title="${kpi.kpiName}">${kpi.kpiName}</div>
                            <div class="kpi-main">${kpi.actual} <span class="kpi-achieve">(${kpi.achievement})</span></div>
                            <div class="kpi-sub-grid">
                                <div>LM: ${kpi.varianceLM}</div>
                                <div>YE: ${kpi.varianceYE}</div>
                            </div>
                        </div>
                    `;
                } else {
                    // Safe structural fallback grid filling
                    faceEl.innerHTML += `<div class="kpi-card" style="opacity:0.15;"><div class="kpi-title">Empty</div></div>`;
                }
            }
        }
    }

    // Navigation trigger: Intercepts click vectors
    function rotateCube(direction) {
        const nextSide = navigationMap[currentSide][direction];
        if (nextSide) {
            updateTableauParameter(nextSide);
        }
    }

    // Parameter write-back pipeline updates Dashboard state
    function updateTableauParameter(sideValue) {
        tableau.extensions.dashboardContent.dashboard.findParameterAsync(parameterName).then(param => {
            if (param) {
                param.changeValueAsync(sideValue).then(() => {
                    applyCubeRotation(sideValue);
                });
            } else {
                console.warn(`Tableau Parameter "${parameterName}" missing. Rendering UI shift locally.`);
                applyCubeRotation(sideValue);
            }
        });
    }

    // Engine rotation mapping apply via hardware accelerated layout properties
    function applyCubeRotation(side) {
        const cube = document.getElementById("cube");
        cube.style.transform = faceRotations[side];
        currentSide = side;
    }

    // Monitors changes to Tableau parameters to rotate the cube from external filters
    function setupParameterListener() {
        tableau.extensions.dashboardContent.dashboard.findParameterAsync(parameterName).then(param => {
            if (param) {
                param.addEventListener(tableau.TableauEventType.ParameterChanged, (evt) => {
                    evt.getParameterAsync().then(updatedParam => {
                        const val = parseInt(updatedParam.currentValue.value);
                        if (val >= 1 && val <= 6 && val !== currentSide) {
                            applyCubeRotation(val);
                        }
                    });
                });
                // Sync position instantly to current startup setting
                const initialVal = parseInt(param.currentValue.value);
                if (initialVal >= 1 && initialVal <= 6) {
                    applyCubeRotation(initialVal);
                }
            }
        });
    }
</script>
</body>
</html>
